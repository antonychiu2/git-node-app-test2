name: CI

on:
  pull_request:
  # deploy.yml calls this on pushes to main, so tests gate every publish.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # CloudBees Smart Tests reads the commit history to see what changed.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The Smart Tests CLI is a Python package (the runner already has Java).
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: npm ci

      # Observation: every test still runs; builds, sessions and results are
      # recorded so Smart Tests learns. Skipped if SMART_TESTS_TOKEN is unset.
      - name: 'Smart Tests: record build and session'
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: sh scripts/smart-tests.sh start "gha-${{ github.run_id }}-${{ github.run_attempt }}-node${{ matrix.node }}" "unit-node${{ matrix.node }}"

      - name: Run tests
        run: |
          mkdir -p test-results
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml

      - name: 'Smart Tests: record test results'
        if: always()
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: sh scripts/smart-tests.sh record test-results/junit.xml test/server.test.js

  version-check:
    name: Version bump check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check VERSION was bumped by exactly 0.1
        run: node scripts/check-version-bump.js "${{ github.event.pull_request.base.sha }}"

  docker-build:
    name: Docker build (no push)
    # On main, deploy.yml builds and pushes the image, so only verify it on PRs.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
