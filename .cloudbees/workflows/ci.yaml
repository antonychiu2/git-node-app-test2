apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: CI

on:
  pull_request:
    branches:
      - "**"
  # deploy.yaml calls this on pushes to main, so tests gate every publish.
  workflow_call:

# CloudBees Smart Tests runs in observation: every test still runs, and each
# build, session and result is recorded so Smart Tests learns from the history.
# scripts/smart-tests.sh never fails the job if Smart Tests is unavailable.

jobs:
  test-node-22:
    steps:
      - name: Check out code
        uses: cloudbees-io/checkout@v1
        with:
          # Smart Tests reads the commit history to see what changed.
          fetch-depth: "0"

      - name: "Smart Tests: record build and session"
        uses: docker://python:3.13-slim
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          sh scripts/smart-tests.sh start "unify-${{ cloudbees.scm.sha }}-node22-$(date +%s)" unit-node22

      # Record the exit code instead of failing here, so test results are
      # published to Unify even when tests fail; the last step fails the job.
      - name: Run tests (Node 22)
        uses: docker://node:22
        kind: test
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          git config --global --add safe.directory "$CLOUDBEES_WORKSPACE"
          npm ci
          mkdir -p test-results
          set +e
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml
          echo $? > test-results/exit-code

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: junit
          results-path: ${{ cloudbees.workspace }}/test-results/junit.xml

      - name: "Smart Tests: record test results"
        uses: docker://python:3.13-slim
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          sh scripts/smart-tests.sh record test-results/junit.xml test/server.test.js

      - name: Fail if tests failed
        uses: docker://node:22
        run: exit "$(cat "$CLOUDBEES_WORKSPACE/test-results/exit-code")"

  version-check:
    # This org's cloudbees.scm context has no PR base-branch/sha field (only
    # branch, ref, sha, repository, ...), so we can't target the PR's actual
    # base branch. Every PR in this repo targets main, so compare against
    # that directly; skip when this workflow is itself running on main
    # (i.e. workflow_call from deploy.yaml on push to main).
    if: ${{ cloudbees.scm.branch != 'main' }}
    steps:
      - name: Check out code
        uses: cloudbees-io/checkout@v1

      - name: Check VERSION was bumped by exactly 0.1
        uses: docker://node:22
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          git config --global --add safe.directory "$CLOUDBEES_WORKSPACE"
          node scripts/check-version-bump.js main

  test-node-24:
    steps:
      - name: Check out code
        uses: cloudbees-io/checkout@v1
        with:
          fetch-depth: "0"

      - name: "Smart Tests: record build and session"
        uses: docker://python:3.13-slim
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          sh scripts/smart-tests.sh start "unify-${{ cloudbees.scm.sha }}-node24-$(date +%s)" unit-node24

      - name: Run tests (Node 24)
        uses: docker://node:24
        kind: test
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          git config --global --add safe.directory "$CLOUDBEES_WORKSPACE"
          npm ci
          mkdir -p test-results
          set +e
          node --test \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/junit.xml
          echo $? > test-results/exit-code

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: junit
          results-path: ${{ cloudbees.workspace }}/test-results/junit.xml

      - name: "Smart Tests: record test results"
        uses: docker://python:3.13-slim
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          sh scripts/smart-tests.sh record test-results/junit.xml test/server.test.js

      - name: Fail if tests failed
        uses: docker://node:24
        run: exit "$(cat "$CLOUDBEES_WORKSPACE/test-results/exit-code")"
