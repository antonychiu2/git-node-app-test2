apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: Smart Tests demo

# Demonstrates CloudBees Smart Tests predictive test selection on the demo
# suite in smart-tests-demo/ (~50 tests, ~12s serial, one deliberately flaky test).
#
#   1. record build + session
#   2. ask Smart Tests which test files to run (subset) for this change
#   3. run them, publish results to Unify and record them in Smart Tests
#
# SMART_TESTS_MODE (see scripts/smart-tests.sh):
#   observe  run and record every file; log the files Smart Tests would have
#            selected (with its ranking) next to the src/ files this branch
#            changed. Use it while the model trains -- see the training plan in
#            smart-tests-demo/README.md.
#   subset   run only the selected files (the time-saving demo).
#   full     run everything without asking for a selection.
# SMART_TESTS_OPTIMIZATION: target (SMART_TESTS_TARGET is a share of expected
# duration, e.g. 40%, so the count barely changes), time (seconds, e.g. 5) or
# confidence (e.g. 90%, so the count varies with how risky the change looks).
# SMART_TESTS_PRIORITIZE_CHANGED: "true" always selects the suite for each
# changed src/<module>.js, on top of the model's choice (logged per file).
# SMART_TESTS_USE_CASE: sets the "change under test" Smart Tests compares the
# tests against (see scripts/smart-tests.sh).
# Test failures don't fail this job: it's a demo.

on:
  pull_request:
    branches:
      - "**"
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SMART_TESTS_MODE: observe
  SMART_TESTS_OPTIMIZATION: target
  SMART_TESTS_TARGET: 40%
  SMART_TESTS_PRIORITIZE_CHANGED: "false"
  # Which changes Smart Tests compares the tests against: one-commit,
  # feature-branch or recurring (empty = the service decides).
  SMART_TESTS_USE_CASE: one-commit
  # The flaky inventory test fails ~70% of runs by default, which makes it top
  # every ranking. It's off while the model learns change -> failure links;
  # remove this line (or set e.g. "0.7") to demo flaky-test detection again.
  SMART_TESTS_DEMO_FLAKY_RATE: "0"
  # Comma-separated suites to fail on purpose (e.g. "tax"), to seed failure
  # history for the training plan. Leave empty normally.
  SMART_TESTS_DEMO_BREAK: ""

jobs:
  smart-tests-demo:
    steps:
      - name: Check out code
        uses: cloudbees-io/checkout@v1
        with:
          fetch-depth: "0"

      - name: "Smart Tests: record build/session and select tests"
        uses: docker://python:3.13-slim
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          sh scripts/smart-tests.sh start "unify-demo-${{ cloudbees.scm.sha }}-$(date +%s)" smart-tests-demo
          sh scripts/smart-tests.sh subset "$SMART_TESTS_TARGET" "$SMART_TESTS_MODE" smart-tests-demo/suites/*.check.js

      - name: Run selected demo tests
        uses: docker://node:22
        kind: test
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          mkdir -p test-results
          set +e
          # shellcheck disable=SC2046
          node --test --test-concurrency=1 \
            --test-reporter=spec --test-reporter-destination=stdout \
            --test-reporter=junit --test-reporter-destination=test-results/smart-tests-demo.xml \
            $(cat .smart-tests/subset.txt)
          echo "Demo tests exit code: $?"

      - name: Publish test results
        uses: cloudbees-io/publish-test-results@v2
        with:
          test-type: junit
          results-path: ${{ cloudbees.workspace }}/test-results/smart-tests-demo.xml

      - name: "Smart Tests: record test results"
        uses: docker://python:3.13-slim
        env:
          SMART_TESTS_TOKEN: ${{ secrets.SMART_TESTS_TOKEN }}
        run: |
          cd "$CLOUDBEES_WORKSPACE"
          sh scripts/smart-tests.sh record test-results/smart-tests-demo.xml $(cat .smart-tests/subset.txt)
